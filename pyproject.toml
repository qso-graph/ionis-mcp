[project]
name = "ionis-mcp"
version = "1.4.0"
description = "MCP server for IONIS-AI HF propagation analytics — 175M signatures from WSPR, RBN, Contest, DXpedition, and PSK Reporter"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
    # The root set TLS verifies against, so it is a dependency this project updates
    # rather than whichever store the running Python was built against. Measured:
    # not transitive via fastmcp, so an undeclared import is an ImportError at
    # startup (qso-graph-devel#73).
    "certifi",
]
keywords = [
    "amateur-radio", "ham-radio", "hf-propagation", "ionosphere", "space-weather",
    "wspr", "rbn", "psk-reporter", "mcp", "model-context-protocol",
    "machine-learning", "pytorch", "neural-network", "big-data", "telemetry",
    "clickhouse", "solar-flux", "geomagnetic", "maidenhead", "propagation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://ionis-ai.com"
Documentation = "https://qso-graph.io"
Repository = "https://github.com/qso-graph/ionis-mcp"
Issues = "https://github.com/qso-graph/ionis-mcp/issues"
Datasets = "https://sourceforge.net/projects/ionis-ai/files"

[project.scripts]
ionis-mcp = "ionis_mcp.server:main"
ionis-download = "ionis_mcp.download:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ionis_mcp"]

[tool.pytest.ini_options]
markers = [
    "live: tests that require network access to external APIs (deselect with '-m not live')",
]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. It was deferred (qso-graph-devel#70) because the rules that find defects went
# in first and this one waited. That pass is done here (#31). E501 reported 56 lines
# in this repo and not one of them was a defect, which is the finding rather than an
# argument against enforcing it.
select = ["E", "F", "I"]
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
